name: PumpSafe Discovery Health Check

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check PumpSafe health
        env:
          PUMPSAFE_DISCOVERY_URL: ${{ secrets.PUMPSAFE_DISCOVERY_URL }}
        run: |
          set -euo pipefail
          test -n "$PUMPSAFE_DISCOVERY_URL"
          BASE_URL="${PUMPSAFE_DISCOVERY_URL%/}"
          BASE_URL="${BASE_URL%/api/discovery/run}"
          curl --silent --show-error --fail-with-body --retry 2 --retry-delay 3 "$BASE_URL/api/health"
